spring.application.name=ev-charging-backend
server.port=8082

# MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/ev_charging_db?useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# JWT
app.jwt.expiration=86400000

# CORS
app.cors.allowed-origins=http://localhost:3000

# Gmail SMTP
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Gemini AI
gemini.model=gemini-1.5-flash




# Local Ollama AI provider

ollama.url=http://localhost:11434
ollama.model=qwen2.5:3b

# Load local credentials when present
spring.config.import=optional:classpath:application-secret.properties
